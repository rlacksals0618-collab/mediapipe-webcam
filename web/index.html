<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gesture Reactions</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --text: #e8eaf0;
      --muted: #8b91a1;
      --accent: #4ade80;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
    #status { color: var(--muted); font-size: 0.95rem; min-height: 1.4em; text-align: center; }
    #status.error { color: var(--warn); }

    .stage {
      position: relative;
      width: min(100%, 960px);
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    #output { width: 100%; height: 100%; display: block; object-fit: cover; }

    #reaction {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.15s ease, transform 0.25s cubic-bezier(.2, 1.6, .4, 1);
    }
    #reaction.show { opacity: 1; transform: scale(1); }
    #reaction .emoji { font-size: clamp(120px, 28vw, 260px); line-height: 1; filter: drop-shadow(0 8px 24px rgba(0,0,0,.5)); }
    #reaction svg { width: clamp(220px, 55%, 520px); height: auto; filter: drop-shadow(0 8px 24px rgba(0,0,0,.6)); }
    #reaction .caption {
      margin-top: 12px;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(0,0,0,.55);
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: .08em;
    }

    #start {
      position: absolute;
      inset: 0;
      margin: auto;
      width: fit-content;
      height: fit-content;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #062b13;
      cursor: pointer;
    }
    #start:disabled { opacity: .5; cursor: wait; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: min(100%, 960px);
    }
    .chip {
      background: var(--panel);
      border: 1px solid #2a2e38;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .chip.active { border-color: var(--accent); color: var(--text); }
    .chip.missing { opacity: .45; }
  </style>
</head>
<body>
  <h1>제스처 리액션</h1>
  <div id="status">모델을 불러오는 중…</div>

  <div class="stage">
    <canvas id="output"></canvas>
    <div id="reaction"></div>
    <button id="start" disabled>카메라 시작</button>
  </div>

  <div class="legend" id="legend"></div>

  <video id="video" playsinline muted hidden></video>
  <script type="module" src="app.js"></script>
</body>
</html>
